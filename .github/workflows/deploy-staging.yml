name: Deploy to Staging

# Read-only branch preflight; does not migrate, deploy, build or notify.
on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Unused on the isolation preflight branch
        type: boolean
        default: false

permissions: {}

jobs:
  isolation-preflight:
    if: github.ref == 'refs/heads/qa/isolated-native-staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check staging bindings without printing values
        env:
          DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
          AUTH_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          ANON: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SERVICE: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: ${{ secrets.STAGING_URL }}
          STRIPE_SECRET: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
          STRIPE_PUBLIC: ${{ secrets.STAGING_STRIPE_PUBLISHABLE_KEY }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re
          from urllib.parse import urlsplit, unquote
          ref = 'pzothyoipifjwnypzcuv'
          def url(name):
              try:
                  return urlsplit(os.environ.get(name, ''))
              except ValueError:
                  return urlsplit('')
          def key_ok(name, role, prefix):
              key = os.environ.get(name, '')
              if key.startswith(prefix):
                  return len(key) > len(prefix) + 15
              try:
                  payload = key.split('.')[1]
                  claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
                  return claims.get('ref') == ref and claims.get('role') == role
              except (ValueError, IndexError, TypeError):
                  return False
          db, auth, app = url('DB_URL'), url('AUTH_URL'), url('APP_URL')
          pooler = bool(re.fullmatch(r'aws-[0-9]+-[a-z0-9-]+[.]pooler[.]supabase[.]com', db.hostname or ''))
          db_target = db.hostname == f'db.{ref}.supabase.co' or (pooler and unquote(db.username or '') == f'postgres.{ref}')
          app_hostname = app.hostname or ''
          distinct_app = app_hostname == 'staging.mintenance.co.uk' or (app_hostname.endswith('.vercel.app') and 'staging' in app_hostname)
          checks = {
              'staging database target': db.scheme in ('postgres', 'postgresql') and db_target and bool(db.password),
              'staging auth origin': auth.scheme == 'https' and auth.netloc == f'{ref}.supabase.co' and not (auth.query or auth.fragment) and auth.path in ('', '/'),
              'public auth key format': key_ok('ANON', 'anon', 'sb_publishable_'),
              'server auth key format': key_ok('SERVICE', 'service_role', 'sb_secret_'),
              'separate staging app origin': app.scheme == 'https' and distinct_app and app.netloc == app_hostname and not (app.query or app.fragment) and app.path in ('', '/'),
              'Stripe sandbox keys': os.environ.get('STRIPE_SECRET','').startswith(('sk_test_','rk_test_')) and os.environ.get('STRIPE_PUBLIC','').startswith('pk_test_'),
              'Expo build token present': bool(os.environ.get('EXPO_TOKEN')),
              'Vercel deployment credentials present': all(os.environ.get(n) for n in ('VERCEL_TOKEN','VERCEL_PROJECT_ID','VERCEL_ORG_ID')),
          }
          for label, ok in checks.items():
              print(f'{label}: {"PASS" if ok else "MISSING OR NOT ISOLATED"}')
          raise SystemExit(0 if all(checks.values()) else 1)
          PY
