name: Mintenance CI/CD Pipeline

# Quality Gates (see docs/CI_QUALITY_GATES.md)
#
#   quality-checks  ──► pr-quality-gate  ──► MERGE BLOCKED if fails
#        │
#        ├─ TypeScript must compile
#        ├─ ESLint must pass
#        ├─ Web + Mobile tests must pass
#        └─ Coverage thresholds auto-enforced by vitest (apps/web/vitest.config.ts):
#             global REGRESSION FLOOR 45/38/52/46 (stmts/branch/funcs/lines —
#             set just under the measured baseline; ratchet up as coverage
#             improves; long-term target 70/65/70/70) plus STRICTER per-glob
#             floors on money-critical payment/escrow paths — see the
#             `thresholds` block in vitest.config.ts for current values.
#
# Branch protection MUST require these status checks:
#   - "Code Quality & Testing"
#   - "PR Quality Gate"
#   - "E2E Tests" (from e2e-tests.yml)
#   - "Performance & Security Monitoring"

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Repo default GITHUB_TOKEN is read-only; pr-quality-gate and quality-gate
# post PR comments via github-script (403 "Resource not accessible by
# integration" on the gate's first-ever run, 2026-07-28), and
# dorny/paths-filter reads the PR file list.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Code Quality & Testing
    runs-on: ubuntu-latest
    env:
      HAS_CODECOV: ${{ secrets.CODECOV_TOKEN != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '20.19.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts=false
        timeout-minutes: 10

      # Turbo local cache: package builds / type-check / lint are content-
      # hashed, so unchanged workspaces replay from .turbo instead of
      # rebuilding. Keyed on SHA with branch-agnostic fallback.
      - name: Turbo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build shared packages
        run: npm run build:packages

      - name: TypeScript compilation check
        run: npm run type-check

      # 2026-04-30 audit P1 — service-role-fallback scoping check.
      # Fails the build if any `userDb` query in apps/web/app/api/**
      # lacks an explicit user-id scope, ownership check, or opt-out
      # marker. See docs/FULL_APP_AUDIT_2026_04_30.md → "Service Role
      # Fallback Requires Route-Level Discipline".
      - name: Service-role scoping check
        run: npx tsx scripts/check-service-role-scoping.ts

      # 2026-04-30 audit P0 — internal-link crawler.
      # Fails the build if any `href`, `router.push`, `router.replace`,
      # or `redirect` references a path that doesn't match a real
      # Next.js route (after resolving [id] / [...slug]). Skips
      # comments, /api/*, /docs/*, mailto/tel, and template literals.
      - name: Internal links resolve
        run: npx tsx scripts/check-internal-links.ts

      # 2026-05-01 audit follow-up — API contract drift check.
      # Fails the build if any POST/PUT/PATCH route under
      # apps/web/app/api/** reads `request.json()` without Zod
      # validation, OR imports symbols from @mintenance/api-contracts
      # that aren't actually used, OR defines a local z.object() with
      # canonical field names (potential drift). Mark deliberate
      # exceptions inline with `// contracts-check: ok — <reason>`.
      - name: API contract drift check
        run: npx tsx scripts/check-api-contracts.ts

      # 2026-05-01 audit follow-up — auth coverage check.
      # Fails the build if any POST/PUT/PATCH/DELETE route under
      # apps/web/app/api/** is exposed without withApiHandler /
      # withCronHandler wrapping, OR declares `auth: false` without
      # a justification comment in the surrounding window. Mark
      # deliberate exceptions inline with `// auth-check: ok — <reason>`.
      - name: Auth coverage check
        run: npx tsx scripts/check-auth-coverage.ts

      # 2026-05-01 audit follow-up — notification direct-insert gate.
      # Fails the build if any file under apps/web inserts directly
      # into the notifications table. Only NotificationService and
      # NotificationProcessorService are allowed to do that; every
      # other path must call NotificationService.createNotification
      # so push, user preferences, and quiet hours apply consistently.
      - name: Notification direct-insert gate
        run: npx tsx scripts/check-notification-inserts.ts

      # 2026-05-02 audit follow-up — banned-tables gate.
      # Fails the build if any runtime caller (under apps/* or packages/*)
      # references a Supabase table that has been retired in production
      # — currently `contractor_invoices` (replaced by `invoices`). Add
      # new bans + their canonical replacements in
      # scripts/check-banned-tables.ts.
      - name: Banned-tables gate
        run: npx tsx scripts/check-banned-tables.ts

      - name: Lint (web)
        run: npm run lint:web

      - name: Lint (mobile)
        run: npm run lint:mobile

      - name: Check no untracked skipped tests (diff only)
        run: node scripts/ci/check-no-skip.js --diff
        if: github.event_name == 'pull_request'

      - name: Run web tests (fails on coverage regression below thresholds)
        run: npm run test:web -- run --coverage

      - name: Run mobile tests (fails on coverage regression below thresholds)
        run: npm run test:mobile -- --coverage --watchAll=false

      - name: Upload coverage to Codecov
        if: ${{ env.HAS_CODECOV == 'true' }}
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

      # Blocking gate: fails the PR on any NEW high/critical advisory in the
      # production dependency tree. Pre-existing tooling advisories are pinned
      # in audit-ci.jsonc's allowlist (2026-07-06 audit #1). Replaces the bare
      # `npm audit --audit-level high`, which exited non-zero on unfixable
      # dev-tooling CVEs and made this step permanently red.
      - name: Security audit (production deps, high+critical)
        run: npm run audit:security

  mobile-pr-smoke:
    name: Mobile E2E Smoke (PR)
    runs-on: ubuntu-latest
    needs: quality-checks
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    # Detox needs the STAGING app env to build; those secrets don't exist
    # yet, so the smoke steps self-skip until they're added (same gating as
    # the Detox jobs in mobile-tests.yml).
    env:
      HAS_STAGING: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL_STAGING != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Detect mobile changes
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - 'packages/shared/**'
              - 'packages/shared-ui/**'
              - 'packages/types/**'

      - name: Setup Node.js
        if: steps.filter.outputs.mobile == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '20.19.4'
          cache: 'npm'

      - name: Install dependencies
        if: steps.filter.outputs.mobile == 'true'
        run: npm ci --ignore-scripts=false
        timeout-minutes: 10

      - name: Setup Java for Android
        if: steps.filter.outputs.mobile == 'true'
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Enable KVM
        if: steps.filter.outputs.mobile == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Detox smoke tests (auth + navigation only)
        if: steps.filter.outputs.mobile == 'true' && env.HAS_STAGING == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0 (2026-07-27: old pin no longer resolves upstream)
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL_STAGING }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY_STAGING }}
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY_TEST }}
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          target: google_apis
          # NOTE: the runner executes each script LINE in a separate shell —
          # a bare `cd` on its own line does not persist (2026-07-28: npm ran
          # at the repo root and died on "Missing script: e2e:build:android").
          script: cd apps/mobile && npm run e2e:build:android && npx detox test --configuration android.emu.debug --testNamePattern="auth|navigation"

      - name: Skip (no mobile changes)
        if: steps.filter.outputs.mobile != 'true'
        run: echo "No mobile code changed — skipping Detox smoke tests."

  mobile-testing:
    name: Mobile E2E Testing
    runs-on: macos-latest
    needs: quality-checks
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '20.19.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts=false

      - name: Setup Java for Android
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2 (2026-07-27: old pin no longer resolves upstream)
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Create Android Emulator
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "system-images;android-34;google_apis;x86_64"
          echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd -n test -k "system-images;android-34;google_apis;x86_64"

      - name: Start Android Emulator
        run: |
          $ANDROID_HOME/emulator/emulator -avd test -no-snapshot -no-window -camera-back none -camera-front none -selinux permissive -qemu -m 2048 &
          adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed | tr -d "\r") ]]; do sleep 1; done; input keyevent 82'

      - name: Run Detox E2E tests
        run: |
          npm run e2e:build:android
          npm run e2e:test:android
        env:
          DETOX_CONFIGURATION: android.emu.debug

  build-staging:
    name: Build Staging Apps
    runs-on: ubuntu-latest
    needs: quality-checks
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    env:
      HAS_EXPO: ${{ secrets.EXPO_TOKEN != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '20.19.4'
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8 (2026-07-27: old pin no longer resolves upstream)
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          eas-version: latest

      - name: Install dependencies
        run: npm ci --ignore-scripts=false
        timeout-minutes: 10

      - name: Build shared packages
        run: npm run build:packages

      - name: Build staging Android
        if: ${{ env.HAS_EXPO == 'true' }}
        run: eas build --platform android --profile staging --non-interactive
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Staging build status
        run: |
          echo "📱 Staging build triggered for develop branch"
          echo "Check EAS dashboard for build status"

  build-production:
    name: Build Production Apps
    runs-on: ubuntu-latest
    needs: quality-checks
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    env:
      HAS_EXPO: ${{ secrets.EXPO_TOKEN != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '20.19.4'
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8 (2026-07-27: old pin no longer resolves upstream)
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          eas-version: latest

      - name: Install dependencies
        run: npm ci --ignore-scripts=false
        timeout-minutes: 10

      - name: Build shared packages
        run: npm run build:packages

      - name: Build production Android
        if: ${{ env.HAS_EXPO == 'true' }}
        run: eas build --platform android --profile production --non-interactive
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build production iOS
        if: ${{ env.HAS_EXPO == 'true' }}
        run: eas build --platform ios --profile production --non-interactive
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Production build status
        run: |
          echo "🚀 Production builds triggered for main branch"
          echo "Check EAS dashboard for build status"
          echo "Manual app store submission required after build completes:"
          echo "  eas submit --platform android --latest"
          echo "  eas submit --platform ios --latest"

  # NOTE: Set EXPO_TOKEN secret in GitHub repository settings for automated builds

  performance-monitoring:
    name: Performance & Security Monitoring
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '20.19.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts=false
        timeout-minutes: 10

      # 2026-07-28: was `npm run test -- --testPathPattern=performance` at
      # the repo root — workspace arg-forwarding dropped the pattern and this
      # job silently re-ran the ENTIRE 12k-test mobile suite a second time.
      - name: Run performance tests
        working-directory: apps/mobile
        run: npx jest --testPathPattern=performance --watchAll=false --maxWorkers=2 --passWithNoTests --forceExit
        env:
          CI: true

      # 2026-07-28: was a global-CLI `expo export` at the repo root (no app
      # there, no env) — mirrors perf-budget's working setup instead.
      - name: Bundle size analysis
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: |
          npx expo export --platform android --output-dir dist
          du -sh dist/
          echo "Bundle size analysis completed"

      - name: Dependency vulnerability scan
        run: |
          npm audit --json > audit-results.json || true
          cat audit-results.json

      # 0BSD/BlueOak/Python-2.0/CC-BY/Unlicense/WTFPL are permissive licenses
      # scattered through the transitive tree; MPL-2.0 (file-level copyleft,
      # fine for unmodified npm deps — currently only @axe-core/playwright,
      # an a11y test tool) failed the gate on its first-ever run 2026-07-28.
      - name: License compliance check
        run: |
          npm install -g license-checker
          # Full inventory first (never fails) so a gate failure below always
          # has the complete license list in the same log.
          license-checker --excludePrivatePackages --summary || true
          # 2026-07-28: flipped from --onlyAllow to --failOn. The real tree
          # contains dozens of permissive-expression variants ((MIT OR
          # CC0-1.0), FSL-1.1-MIT, MIT AND OFL-1.1, "UNKNOWN", custom URLs…)
          # that an exact-string allowlist can never enumerate — the step had
          # never actually run before today and failed on its first contact
          # with reality. Deny strong copyleft / source-available instead;
          # dual-licensed "(X OR GPL)" strings deliberately don't match since
          # the permissive choice applies.
          license-checker --excludePrivatePackages --failOn 'GPL-2.0;GPL-3.0;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0-only;GPL-3.0-or-later;AGPL-1.0;AGPL-3.0;AGPL-3.0-only;AGPL-3.0-or-later;LGPL-2.0;LGPL-2.1;SSPL-1.0;BUSL-1.1;CC-BY-NC-4.0' --summary

  pr-quality-gate:
    name: PR Quality Gate
    runs-on: ubuntu-latest
    needs: [quality-checks, performance-monitoring, mobile-pr-smoke]
    if: github.event_name == 'pull_request'
    # Always runs so a failure in any upstream job produces a failing required check.
    # Mobile smoke is a "success-or-skipped" gate (skipped when no mobile files change).

    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.quality-checks.result }}" != "success" ] || \
             [ "${{ needs.performance-monitoring.result }}" != "success" ] || \
             [ "${{ needs.mobile-pr-smoke.result }}" = "failure" ]; then
            echo "❌ Quality checks failed - PR cannot be merged"
            echo "  quality-checks: ${{ needs.quality-checks.result }}"
            echo "  performance-monitoring: ${{ needs.performance-monitoring.result }}"
            echo "  mobile-pr-smoke: ${{ needs.mobile-pr-smoke.result }}"
            exit 1
          else
            echo "✅ All quality checks passed - PR ready for review"
          fi

      - name: Comment on PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const qualityChecks = '${{ needs.quality-checks.result }}';
            const performanceMonitoring = '${{ needs.performance-monitoring.result }}';
            const mobileSmoke = '${{ needs.mobile-pr-smoke.result }}';

            const statusEmoji = (status) => {
              if (status === 'success') return '✅';
              if (status === 'skipped') return '⏭️';
              return '❌';
            };

            const comment = `## 🔍 CI/CD Pipeline Results

            ${statusEmoji(qualityChecks)} **Code Quality & Testing**: ${qualityChecks}
            ${statusEmoji(performanceMonitoring)} **Performance & Security**: ${performanceMonitoring}
            ${statusEmoji(mobileSmoke)} **Mobile E2E Smoke**: ${mobileSmoke}

            ---

            ${qualityChecks === 'success' && performanceMonitoring === 'success' && mobileSmoke !== 'failure'
              ? '✅ **All checks passed!** This PR is ready for review and merge.'
              : '❌ **Some checks failed.** Please review the failed jobs and fix the issues.'}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  notify:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: quality-checks
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    env:
      HAS_SLACK: ${{ secrets.SLACK_WEBHOOK != '' }}

    steps:
      - name: Notify team
        if: ${{ env.HAS_SLACK == 'true' }}
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e # v3
        with:
          status: ${{ job.status }}
          channel: '#mintenance-deployments'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author,action,eventName,ref,workflow