name: Mobile Build Pipeline (EAS)

on:
  push:
    branches:
      - Main
      - main
      - develop
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/mobile-build.yml'
      - 'tools/eas-cli/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/mobile-build-changes*.cjs'
  pull_request:
    branches:
      - Main
      - main
      - develop
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/mobile-build.yml'
      - 'tools/eas-cli/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/mobile-build-changes*.cjs'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - android
          - ios
          - all
        default: 'android'
      profile:
        description: 'Build profile'
        required: true
        type: choice
        options:
          - internal
          - development
          - staging
          - production
        default: 'internal'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.platform || 'auto' }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # PRE-BUILD VALIDATION
  # ============================================================
  pre-build-checks:
    name: Pre-Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      should-build: ${{ steps.check-changes.outputs.should-build }}
      build-profile: ${{ steps.determine-profile.outputs.profile }}

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '20.19.4'
          cache: 'npm'

      - name: Check native build change detection
        run: node --test scripts/mobile-build-changes.test.cjs

      - name: Check for mobile changes
        id: check-changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/mobile-build-changes.cjs

      - name: Determine build profile
        id: determine-profile
        env:
          REQUESTED_PROFILE: ${{ github.event.inputs.profile }}
          REQUESTED_PLATFORM: ${{ github.event.inputs.platform }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            PROFILE="$REQUESTED_PROFILE"
            if [ "$GITHUB_REF" = "refs/heads/test/my-home-staging-apk" ]; then
              if [ "$PROFILE" != staging ] || [ "$REQUESTED_PLATFORM" != android ]; then
                echo "::error::This QA ref only permits a staging Android APK." >&2
                exit 1
              fi
              PROFILE=agency-qa-android
            fi
          elif [ "$GITHUB_REF" = "refs/heads/Main" ] || [ "$GITHUB_REF" = "refs/heads/main" ]; then
            PROFILE=internal
          elif [ "$GITHUB_REF" = "refs/heads/develop" ]; then
            PROFILE=staging
          else
            PROFILE=development
          fi

          case "$PROFILE" in
            internal|development|staging|production|agency-qa-android) ;;
            *) echo "::error::Invalid build profile" >&2; exit 1 ;;
          esac
          printf 'profile=%s\n' "$PROFILE" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        # This CPU-only runner needs bundled ONNX, not optional Linux CUDA binaries.
        env:
          ONNXRUNTIME_NODE_INSTALL: 'skip'
        run: npm ci --ignore-scripts=false

      - name: Verify ONNX CPU runtime
        run: node scripts/ci/verify-onnx-cpu.cjs
        timeout-minutes: 1

      - name: Check native dependency install policy (offline)
        run: node --test scripts/ci/native-onnx-install.test.cjs

      - name: Check Expo Metro defaults (no native build)
        run: node --test scripts/ci/mobile-metro-config.test.cjs

      - name: Check Expo SDK dependency alignment (no native build)
        working-directory: apps/mobile
        run: npx expo install --check

      - name: Validate environment
        if: steps.determine-profile.outputs.profile != 'agency-qa-android'
        working-directory: apps/mobile
        # These secrets exist in repo settings but were never mapped into this
        # step's env, so validate:env failed on every run (2026-07-27 triage).
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: npm run validate:env

      - name: Type check
        working-directory: apps/mobile
        run: npm run type-check

      - name: Lint mobile code
        working-directory: apps/mobile
        run: npm run lint

  # ============================================================
  # ANDROID BUILD (EAS)
  # ============================================================
  # Pushes and PRs validate; paid native builds require an explicit manual request.
  build-android:
    name: Build Android (${{ needs.pre-build-checks.outputs.build-profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: pre-build-checks
    if: |
      github.event_name == 'workflow_dispatch' &&
      needs.pre-build-checks.outputs.should-build == 'true' &&
      needs.pre-build-checks.outputs.build-profile != 'agency-qa-android' &&
      (github.event.inputs.platform == 'android' ||
       github.event.inputs.platform == 'all' ||
       github.event_name != 'workflow_dispatch')

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '20.19.4'
          cache: 'npm'

      - name: Install pinned EAS CLI
        run: |
          npm ci --prefix tools/eas-cli --ignore-scripts --engine-strict --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/tools/eas-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        # This CPU-only runner needs bundled ONNX, not optional Linux CUDA binaries.
        env:
          ONNXRUNTIME_NODE_INSTALL: 'skip'
        run: npm ci --ignore-scripts=false

      - name: Verify ONNX CPU runtime
        run: node scripts/ci/verify-onnx-cpu.cjs
        timeout-minutes: 1

      - name: Build shared packages
        run: npm run build:packages

      - name: Configure EAS credentials
        working-directory: apps/mobile
        run: |
          echo "Setting up EAS credentials..."
          # Credentials are managed via secrets

      - name: Build Android APK/AAB
        working-directory: apps/mobile
        run: |
          case "$PROFILE" in
            internal|development|staging|production) ;;
            *) echo "::error::Invalid build profile" >&2; exit 1 ;;
          esac
          eas build --platform android --profile "$PROFILE" --non-interactive --no-wait
        env:
          PROFILE: ${{ needs.pre-build-checks.outputs.build-profile }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

      - name: Wait for build completion
        working-directory: apps/mobile
        run: |
          echo "Build submitted to EAS. Check status at:"
          echo "https://expo.dev/accounts/$(cat package.json | grep -o '"name": "[^"]*' | cut -d'"' -f4)/projects/mintenance/builds"

      - name: Get build URL
        id: build-url
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_URL=$(eas build:list --platform android --limit 1 --json | jq -r '.[0].artifacts.buildUrl')
          echo "build-url=$BUILD_URL" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Post build summary
        env:
          PROFILE: ${{ needs.pre-build-checks.outputs.build-profile }}
        run: |
          echo "## Android Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Profile: %s\n' "$PROFILE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platform: Android" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: Submitted to EAS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[View build status on EAS](https://expo.dev)" >> "$GITHUB_STEP_SUMMARY"

  build-android-staging:
    name: Build isolated Android staging APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: pre-build-checks
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/test/my-home-staging-apk' &&
      needs.pre-build-checks.outputs.build-profile == 'agency-qa-android'
    environment: STRIPE_TEST_SECRET_KEY
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '20.19.4'
          cache: 'npm'

      - name: Install pinned EAS CLI
        run: |
          npm ci --prefix tools/eas-cli --ignore-scripts --engine-strict --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/tools/eas-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: 'skip'
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Preflight and submit isolated Android APK
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SANDBOX_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
          MINTENANCE_ANDROID_STAGING_PROJECT: '1'
          EXPO_NO_DOTENV: '1'
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "::error::EXPO_TOKEN is required."
            exit 1
          fi
          if [[ ! "$SANDBOX_PUBLISHABLE_KEY" =~ ^pk_test_[A-Za-z0-9]+$ ]]; then
            echo "::error::STRIPE_TEST_PUBLISHABLE_KEY must be a sandbox publishable key."
            exit 1
          fi
          eas env:create preview --scope project --name MINTENANCE_STAGING_STRIPE_KEY \
            --value "$SANDBOX_PUBLISHABLE_KEY" --visibility sensitive --force --non-interactive
          unset SANDBOX_PUBLISHABLE_KEY
          eas env:exec preview "node ../../scripts/validate-eas-config.cjs agency-qa-android" --non-interactive
          build_json=$(eas build --platform android --profile agency-qa-android --non-interactive --no-wait --json)
          build_id=$(jq -er '.[0].id' <<<"$build_json")
          printf 'EAS build: https://expo.dev/accounts/mintenance-ltd/projects/mintenance-android-staging/builds/%s\n' "$build_id" | tee -a "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # iOS BUILD (EAS)
  # ============================================================
  build-ios:
    name: Build iOS (${{ needs.pre-build-checks.outputs.build-profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: pre-build-checks
    if: |
      github.event_name == 'workflow_dispatch' &&
      needs.pre-build-checks.outputs.should-build == 'true' &&
      (github.event.inputs.platform == 'ios' ||
       github.event.inputs.platform == 'all' ||
       (github.event_name != 'workflow_dispatch' &&
        (github.ref == 'refs/heads/Main' || github.ref == 'refs/heads/main')))

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '20.19.4'
          cache: 'npm'

      - name: Install pinned EAS CLI
        run: |
          npm ci --prefix tools/eas-cli --ignore-scripts --engine-strict --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/tools/eas-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        # This CPU-only runner needs bundled ONNX, not optional Linux CUDA binaries.
        env:
          ONNXRUNTIME_NODE_INSTALL: 'skip'
        run: npm ci --ignore-scripts=false

      - name: Verify ONNX CPU runtime
        run: node scripts/ci/verify-onnx-cpu.cjs
        timeout-minutes: 1

      - name: Build shared packages
        run: npm run build:packages

      - name: Build iOS
        working-directory: apps/mobile
        run: |
          case "$PROFILE" in
            internal|development|staging|production) ;;
            *) echo "::error::Invalid build profile" >&2; exit 1 ;;
          esac
          eas build --platform ios --profile "$PROFILE" --non-interactive --no-wait
        env:
          PROFILE: ${{ needs.pre-build-checks.outputs.build-profile }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

      - name: Post build summary
        env:
          PROFILE: ${{ needs.pre-build-checks.outputs.build-profile }}
        run: |
          echo "## iOS Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Profile: %s\n' "$PROFILE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platform: iOS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: Submitted to EAS" >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # POST-BUILD VERIFICATION
  # ============================================================
  post-build-verification:
    name: Post-Build Verification
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')

    steps:
      - name: Verify builds
        run: |
          echo "## Build Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build-android.result }}" = "success" ]; then
            echo "✅ Android build submitted successfully" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.build-ios.result }}" = "success" ]; then
            echo "✅ iOS build submitted successfully" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check build progress on [Expo Dashboard](https://expo.dev)" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # NOTIFY ON FAILURE
  # ============================================================
  notify-failure:
    name: Notify Build Failure
    runs-on: ubuntu-latest
    permissions:
      issues: write
    needs: [build-android, build-ios]
    if: |
      failure() &&
      (github.ref == 'refs/heads/Main' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Create issue on failure
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const title = `Mobile build failed for ${context.ref}`;
            const body = `## Mobile Build Failure

            **Branch:** ${context.ref}
            **Commit:** ${context.sha}
            **Workflow:** ${context.workflow}
            **Run ID:** ${context.runId}

            [View workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

            ### Failed Jobs
            - Android: ${{ needs.build-android.result }}
            - iOS: ${{ needs.build-ios.result }}

            Please investigate and fix the build issues.
            `;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['build-failure', 'mobile', 'urgent']
            });
