name: Publish Packages to GitHub Packages

on:
  # Trigger on push to main branch when package files change
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/publish-packages.yml'

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (leave empty for all)'
        required: false
        type: choice
        options:
          - all
          - types
          - shared
          - auth

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '20.19.4'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mintenance'

      - name: Install dependencies
        run: npm ci --ignore-scripts=false

      - name: Build packages
        run: npm run build:packages

      # NOTE (2026-07-27): the root .npmrc pins @mintenance:registry to
      # registry.npmjs.org as a dependency-confusion guard, and that project
      # config was winning over publishConfig — every publish hit npmjs
      # unauthenticated (ENEEDAUTH, silently swallowed by `|| echo`). The
      # explicit --registry flag outranks .npmrc. The old "@mintenance/ui"
      # step was also removed: packages/ui was renamed to shared-ui (which is
      # private) long ago, and the dangling `cd packages/ui` failed every run.

      # Publish types package (no dependencies, publish first)
      - name: Publish @mintenance/types
        if: github.event.inputs.package == 'types' || github.event.inputs.package == 'all' || github.event.inputs.package == ''
        run: |
          cd packages/types
          npm publish --registry=https://npm.pkg.github.com || echo "Package already published or failed"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish shared package (depends on types)
      - name: Publish @mintenance/shared
        if: github.event.inputs.package == 'shared' || github.event.inputs.package == 'all' || github.event.inputs.package == ''
        run: |
          cd packages/shared
          npm publish --registry=https://npm.pkg.github.com || echo "Package already published or failed"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish auth package (depends on types)
      - name: Publish @mintenance/auth
        if: github.event.inputs.package == 'auth' || github.event.inputs.package == 'all' || github.event.inputs.package == ''
        run: |
          cd packages/auth
          npm publish --registry=https://npm.pkg.github.com || echo "Package already published or failed"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Summary
        run: |
          echo "### Published Packages :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following packages have been published to GitHub Packages:" >> $GITHUB_STEP_SUMMARY
          echo "- @mintenance/types" >> $GITHUB_STEP_SUMMARY
          echo "- @mintenance/shared" >> $GITHUB_STEP_SUMMARY
          echo "- @mintenance/auth" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View packages at: https://github.com/orgs/Mintenance-LTD/packages" >> $GITHUB_STEP_SUMMARY
