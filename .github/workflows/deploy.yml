name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '20.19.4'
          cache: npm

      - name: Install dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci --ignore-scripts=false
        timeout-minutes: 10

      - name: Test release guard
        run: node --test scripts/check-release-migrations.test.cjs scripts/vercel-build.test.cjs

      # No secret-presence condition: missing credentials must block main.
      # Apply reviewed, backwards-compatible migrations separately before release.
      - name: Verify production migration prerequisites
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERCEL_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: https://ukrjudtlvapiajkjbcrd.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-release-migrations.cjs

      - name: Type check
        run: npm run type-check:web

      - name: Lint
        run: npm run lint:web

      - name: Build
        run: npm run build:web
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Run tests (web)
        run: npm run test:web -- run

      # Vercel Git builds independently. scripts/vercel-build.js also executes
      # the same fail-closed preflight before compilation. Never run db push
      # against all historical files here: legacy history includes bundled
      # and deliberately deferred migrations. No automatic schema mutation.
