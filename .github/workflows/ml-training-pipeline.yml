name: ML Tooling Validation - Training Held

# Validate local tooling only while the legacy orchestrator is incomplete.
on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ml-training-pipeline.yml'
      - 'requirements-ml.txt'
      - 'scripts/ml/**'

permissions:
  contents: read

jobs:
  validate-tooling:
    name: Validate ML tooling (no training)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v4
        with:
          python-version: '3.10'
      - name: Validate tooling dependencies
        run: python -m pip install --no-index -r requirements-ml.txt
      - name: Test report and workflow boundaries
        run: python -m unittest discover -s scripts/ml -p 'test_pipeline_readiness.py' -v
      - name: Generate readiness report
        if: always()
        run: python scripts/ml/generate_data_report.py --output output/ml-readiness.html
      - name: Retain readiness report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: ml-readiness
          path: output/ml-readiness.html
          if-no-files-found: error
          retention-days: 14
