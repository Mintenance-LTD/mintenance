name: Storage Integrity Check

# Read-only nightly audit. Bare paths use the source-specific storage bucket.
# Exit 1 reports confirmed missing/invalid references; exit 2 means incomplete
# coverage (query, lookup, configuration or pagination failure).
# The aggregate report contains no signed URLs, object paths or raw row IDs.
# A finding reference is SHA-256 of "table:rowId:photoIndex" for authorized triage.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  storage-integrity:
    name: Verify storage references resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20.19.4
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run storage integrity check
        env:
          # Service role key is required to list non-public buckets
          # (e.g. contractor-documents, job-attachments). Pull from
          # GitHub secrets — never hard-code.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/storage-integrity-check.ts

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-integrity-report
          path: scripts/storage-integrity-report.json
          if-no-files-found: error
          retention-days: 30
