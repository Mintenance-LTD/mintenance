name: Integration Tests (Real DB)

# Runs real-DB integration tests against a local Supabase instance spun up in CI.
# Complements the mock-based tests in quality-checks with actual RLS/constraint verification.
#
# See docs/TESTING_INTEGRATION.md for the full guide.

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'apps/web/__tests__/integration-real/**'
      - 'apps/web/test/integration/**'
      - 'apps/web/vitest.integration.config.ts'
      - 'apps/web/scripts/run-integration-tests.js'
      - 'apps/web/lib/services/escrow/**'
      - 'apps/web/lib/services/notifications/**'
      - 'apps/web/lib/services/payments/**'
      - 'apps/web/lib/services/contracts/**'
      - 'apps/web/lib/services/agents/escrow/**'
      - 'apps/web/lib/api/with-api-handler.ts'
      - 'supabase/migrations/**'
      - 'scripts/db-tests/**'
      - '.github/workflows/integration-tests.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'apps/web/__tests__/integration-real/**'
      - 'apps/web/test/integration/**'
      - 'apps/web/vitest.integration.config.ts'
      - 'apps/web/scripts/run-integration-tests.js'
      - 'apps/web/lib/services/escrow/**'
      - 'apps/web/lib/services/notifications/**'
      - 'apps/web/lib/services/payments/**'
      - 'apps/web/lib/services/contracts/**'
      - 'apps/web/lib/services/agents/escrow/**'
      - 'apps/web/lib/api/with-api-handler.ts'
      - 'supabase/migrations/**'
      - 'scripts/db-tests/**'
      - '.github/workflows/integration-tests.yml'
  workflow_dispatch:
    inputs:
      payment_sandbox:
        description: Run real Stripe test-mode payment acceptance against disposable Supabase
        type: boolean
        default: false

jobs:
  payment-sandbox:
    name: Stripe sandbox payment acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.payment_sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # User-provisioned GitHub environment containing the two dedicated test keys.
    environment: STRIPE_TEST_SECRET_KEY
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '20.19.4'
          cache: npm
      - name: Require test-mode credentials
        env:
          SANDBOX_SECRET: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          SANDBOX_PUBLIC: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const secret = process.env.SANDBOX_SECRET || '';
          const publishable = process.env.SANDBOX_PUBLIC || '';
          if (!/^sk_test_[A-Za-z0-9]+$/.test(secret) || !/^pk_test_[A-Za-z0-9]+$/.test(publishable)) {
            throw new Error('Configure STRIPE_TEST_SECRET_KEY and STRIPE_TEST_PUBLISHABLE_KEY in Actions secrets. Live keys are rejected.');
          }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'payment-sandbox.env'),
            'STRIPE_SECRET_KEY=' + secret + '\nNEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=' + publishable + '\n', { mode: 0o600 });
          NODE
      - name: Install dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci
      - run: npm run build:packages
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.119.0
      - name: Prepare isolated payment database
        run: node scripts/readiness/prepare-local.cjs
      - name: Start isolated payment database
        run: supabase start --workdir output/readiness-stack
      - name: Exercise authenticated payment, refunds and settlement
        run: |
          supabase status --workdir output/readiness-stack --output json > "$RUNNER_TEMP/payment-db-status.json"
          node scripts/readiness/run-payment-sandbox.cjs "$RUNNER_TEMP/payment-sandbox.env" "$RUNNER_TEMP/payment-db-status.json"
      - name: Stop isolated payment database
        if: always()
        run: |
          if [ -d output/readiness-stack ]; then supabase stop --workdir output/readiness-stack --no-backup; fi
          rm -f "$RUNNER_TEMP/payment-sandbox.env" "$RUNNER_TEMP/payment-db-status.json"

  authorization-regressions:
    name: Database authorization and concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: scripts/db-tests/package-lock.json
      - run: npm ci --prefix scripts/db-tests
      - name: Prepare pinned PostgreSQL test binaries
        working-directory: scripts/db-tests/node_modules/@embedded-postgres/linux-x64
        run: node scripts/hydrate-symlinks.js
      - run: npm test --prefix scripts/db-tests
      - run: npm run test:operator-alerts --prefix scripts/db-tests
      - run: npm run test:chargebacks --prefix scripts/db-tests
      - run: npm run test:transfer-recovery --prefix scripts/db-tests
      - run: npm run test:inspections --prefix scripts/db-tests
      - run: npm run test:availability --prefix scripts/db-tests
      - name: Check onboarding recovery and legacy migration compatibility
        run: |
          npm run test:onboarding --prefix scripts/db-tests
          npm run test:onboarding --prefix scripts/db-tests -- --legacy-first

  integration-tests:
    name: Integration Tests (Real DB)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '20.19.4'
          cache: 'npm'

      - name: Install dependencies
        # CPU runners use bundled ONNX binaries; skip only the extra CUDA download.
        env:
          ONNXRUNTIME_NODE_INSTALL: 'skip'
        run: |
          npm install --global npm@11.6.2
          npm ci --ignore-scripts=false
        timeout-minutes: 10

      - name: Build shared packages
        run: npm run build:packages

      - name: Install Supabase CLI
        # 2026-07-27: previous pin 8e24e7f8... no longer resolves upstream
        # (commit garbage-collected) — every run died at "Set up job".
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.119.0

      - name: Start Supabase stack
        run: supabase start
        # Supabase CLI spins up Postgres + GoTrue + PostgREST in Docker.
        # Uses ports 54321 (REST), 54322 (Postgres), 54323 (Studio).
        # Migrations in supabase/migrations/ are applied automatically.

      - name: Load local test credentials and verify Supabase
        run: |
          supabase status --output json > "$RUNNER_TEMP/supabase-status.json"
          ANON_KEY=$(jq -er '.ANON_KEY' "$RUNNER_TEMP/supabase-status.json")
          SERVICE_KEY=$(jq -er '.SERVICE_ROLE_KEY' "$RUNNER_TEMP/supabase-status.json")
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_KEY"
          echo "SUPABASE_TEST_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_TEST_SERVICE_KEY=$SERVICE_KEY" >> "$GITHUB_ENV"
          # Probe a bounded table read; the full OpenAPI document can exceed
          # the statement timeout with this schema's hundreds of functions.
          curl --fail --retry 5 --retry-connrefused --retry-delay 2 \
            'http://localhost:54321/rest/v1/profiles?select=id&limit=0' \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
            --output /dev/null

      - name: Run integration tests
        working-directory: apps/web
        run: npm run test:integration
        env:
          INTEGRATION_TESTS: '1'
          # Supabase CLI generates these deterministically on local start.
          # They are NOT production keys.
          SUPABASE_TEST_URL: http://localhost:54321

      - name: Dump Supabase logs on failure
        if: failure()
        run: supabase status && docker ps && docker logs supabase_db_mintenance-clean 2>&1 | tail -100 || true

      - name: Stop Supabase
        if: always()
        run: supabase stop || true
