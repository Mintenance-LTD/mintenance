name: Load Test (k6 Smoke)

on:
  # Validate installation and the smoke script using loopback fixtures only.
  pull_request:
    branches: [main]
    paths:
      - '.github/actions/setup-k6/**'
      - '.github/workflows/load-test.yml'
      - 'apps/web/load-tests/k6/smoke-*'
      - 'scripts/k6-smoke.test.mjs'

  # Manual trigger with configurable target URL
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Staging origin (defaults to STAGING_URL; production excluded)'
        required: false
        default: ''
      vus:
        description: 'Virtual users: 1 to 10, one iteration each (default: 10)'
        required: false
        default: '10'

  # Weekly schedule - runs every Monday at 06:00 UTC
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: load-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-installer:
    name: Verify k6 installation (no application traffic)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install k6
        uses: ./.github/actions/setup-k6

      - name: Execute a bounded offline k6 check
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/k6-install-check.js" <<'JS'
          import { check } from 'k6';
          export const options = {
            vus: 1,
            iterations: 1,
            thresholds: { checks: ['rate==1'] },
          };
          export default function () {
            check(1, { 'k6 executes checks': (value) => value === 1 });
          }
          JS
          k6 run --no-usage-report "$RUNNER_TEMP/k6-install-check.js"

      - name: Setup Node.js for local fixture regressions
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '20.19.4'

      - name: Verify restored smoke test against local fixtures
        run: node --test scripts/k6-smoke.test.mjs

  smoke-test:
    name: k6 Smoke Test
    # PRs exercise the installer and loopback fixtures, with no app credentials.
    if: github.event_name != 'pull_request'
    needs: verify-installer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: ${{ inputs.target_url || secrets.STAGING_URL }}
      VUS: ${{ inputs.vus || '10' }}
      TEST_USER_EMAIL: ${{ secrets.E2E_HOMEOWNER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.E2E_HOMEOWNER_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install k6
        uses: ./.github/actions/setup-k6

      - name: Verify smoke script exists
        run: |
          if [ ! -f apps/web/load-tests/k6/smoke-test.js ]; then
            echo '::error::Missing apps/web/load-tests/k6/smoke-test.js; no application load test has run.'
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '20.19.4'

      - name: Validate staging configuration
        working-directory: apps/web/load-tests/k6
        run: node --input-type=module -e "import { readConfig } from './smoke-config.mjs'; readConfig(process.env)"

      - name: Run k6 smoke test
        id: smoke
        working-directory: apps/web/load-tests/k6
        shell: bash
        run: |
          set -euo pipefail
          k6 run --no-usage-report smoke-test.js 2>&1 | tee k6-output.txt
        continue-on-error: true

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: k6-load-test-results
          path: |
            apps/web/load-tests/k6/load-test-results.json
            apps/web/load-tests/k6/k6-output.txt
          retention-days: 30
          if-no-files-found: error

      - name: Require successful execution and complete results
        if: always()
        working-directory: apps/web/load-tests/k6
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          if [ "$SMOKE_OUTCOME" != 'success' ]; then
            echo '::error::The smoke test did not complete successfully; performance is unverified.'
            exit 1
          fi
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('load-test-results.json','utf8')); if(r.thresholdsPassed!==true || !(r.totalRequests>0)) process.exit(1)"

      - name: Notify Slack on failure
        if: failure() && github.event_name == 'schedule'
        env:
          HAS_SLACK: ${{ secrets.SLACK_WEBHOOK != '' }}
          SECRETS_SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ "$HAS_SLACK" = "true" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"Staging smoke verification failed or could not run. <${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|View run>\"}" \
              "${SECRETS_SLACK_WEBHOOK}"
          else
            echo "Slack webhook not configured - skipping notification"
          fi

permissions:
  contents: read
