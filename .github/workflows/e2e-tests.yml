name: E2E Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/e2e-tests.yml'
      - 'scripts/ci/*e2e*'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/e2e-tests.yml'
      - 'scripts/ci/*e2e*'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  e2e-tests:
    name: E2E Tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # 2026-07-28 PM: 45min per shard. The 60min single-job run (30366471487)
    # was killed at exactly 60:00; sharding 2× + Chromium-only PRs + 1 retry
    # + video-on-retry-only should land each shard well under this.
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '20.19.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts=false
        timeout-minutes: 10

      - name: Build shared packages
        run: npm run build:packages

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps

      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.118.0

      - name: Prepare disposable database
        run: node scripts/ci/prepare-e2e-stack.cjs

      - name: Start disposable database and apply migrations
        run: supabase start --workdir output/e2e-stack > output/e2e-stack/start.log 2>&1

      - name: Seed synthetic accounts and generate isolated credentials
        run: |
          supabase status --workdir output/e2e-stack --output json > output/e2e-stack/status.json
          node scripts/ci/bootstrap-e2e.cjs output/e2e-stack/status.json

      - name: Verify environment isolation
        run: |
          node --test scripts/ci/check-e2e-environment.test.cjs
          node scripts/ci/check-e2e-environment.cjs

      - name: Build web app
        working-directory: apps/web
        run: npm run build

      - name: Run E2E tests
        working-directory: apps/web
        run: npx playwright test --shard=${{ matrix.shard }}/2
        env:
          E2E_ALL_BROWSERS: ${{ github.event_name == 'push' && 'true' || 'false' }}

      - name: Stop disposable database
        if: always()
        run: supabase stop --workdir output/e2e-stack --no-backup

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: apps/web/playwright-report/
          retention-days: 30

      - name: Upload mobile responsive screenshots
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: mobile-screenshots-shard-${{ matrix.shard }}
          path: apps/web/test-results/mobile-screenshots/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: playwright-videos-shard-${{ matrix.shard }}
          path: apps/web/test-results/
          retention-days: 7
