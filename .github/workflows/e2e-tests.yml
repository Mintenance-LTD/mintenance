name: E2E Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/e2e-tests.yml'
      - 'scripts/ci/*e2e*'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/e2e-tests.yml'
      - 'scripts/ci/*e2e*'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  e2e-tests:
    name: E2E Tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # 2026-07-28 PM: 45min per shard. The 60min single-job run (30366471487)
    # was killed at exactly 60:00; sharding 2× + Chromium-only PRs + 1 retry
    # + video-on-retry-only should land each shard well under this.
    timeout-minutes: 45

    # Production-mode tests exercise the real limiter against disposable Redis.
    services:
      redis:
        image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis-http:
        image: hiett/serverless-redis-http@sha256:65128347949bca511e448fd7238780d624573d74c22b79155a7563db19e9b678
        env:
          SRH_MODE: env
          SRH_TOKEN: isolated-e2e-redis
          SRH_CONNECTION_STRING: redis://redis:6379
        ports:
          - 8079:80
    env:
      UPSTASH_REDIS_REST_URL: http://127.0.0.1:8079
      UPSTASH_REDIS_REST_TOKEN: isolated-e2e-redis

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '20.19.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts=false
        timeout-minutes: 10

      - name: Verify disposable Redis
        run: |
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 \
            -H "Authorization: Bearer $UPSTASH_REDIS_REST_TOKEN" \
            "$UPSTASH_REDIS_REST_URL/ping" | grep -q PONG

      - name: Build shared packages
        run: npm run build:packages

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps

      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.118.0

      - name: Prepare disposable database
        run: node scripts/ci/prepare-e2e-stack.cjs

      - name: Start disposable database and apply migrations
        run: supabase start --workdir output/e2e-stack > output/e2e-stack/start.log 2>&1

      - name: Seed synthetic accounts and generate isolated credentials
        run: |
          supabase status --workdir output/e2e-stack --output json > output/e2e-stack/status.json
          node scripts/ci/bootstrap-e2e.cjs output/e2e-stack/status.json

      - name: Verify environment isolation
        run: |
          node --test scripts/ci/check-e2e-environment.test.cjs
          node scripts/ci/check-e2e-environment.cjs

      - name: Build web app
        working-directory: apps/web
        run: npm run build

      - name: Run E2E tests
        working-directory: apps/web
        run: npx playwright test --shard=${{ matrix.shard }}/2
        env:
          E2E_ALL_BROWSERS: ${{ github.event_name == 'push' && 'true' || 'false' }}

      - name: Stop disposable database
        if: always()
        run: supabase stop --workdir output/e2e-stack --no-backup

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: apps/web/playwright-report/
          retention-days: 30

      - name: Upload mobile responsive screenshots
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: mobile-screenshots-shard-${{ matrix.shard }}
          path: apps/web/test-results/mobile-screenshots/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: playwright-videos-shard-${{ matrix.shard }}
          path: apps/web/test-results/
          retention-days: 7
