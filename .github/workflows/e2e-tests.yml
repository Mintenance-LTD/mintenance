name: E2E Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/e2e-tests.yml'
  workflow_dispatch:

jobs:
  e2e-tests:
    name: E2E Tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # 2026-07-28 PM: 45min per shard. The 60min single-job run (30366471487)
    # was killed at exactly 60:00; sharding 2× + Chromium-only PRs + 1 retry
    # + video-on-retry-only should land each shard well under this.
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '20.19.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts=false
        timeout-minutes: 10

      - name: Build shared packages
        run: npm run build:packages

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps

      # lib/env.ts hard-requires ENCRYPTION_MASTER_KEY + CSRF_SECRET at
      # production runtime (`next start` sets NODE_ENV=production). These are
      # test-run-only values — nothing encrypted in CI outlives the job — so
      # generate them per run instead of storing more repo secrets.
      - name: Generate ephemeral CI-only secrets
        run: |
          echo "ENCRYPTION_MASTER_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CSRF_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Build web app
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Fail-closed config (packages/auth) throws at build-time page-data
          # collection when JWT_SECRET is absent (2026-07-27 hardening).
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # NEXT_PUBLIC_* values are inlined into client bundles at build time,
          # so the publishable key must be present HERE, not just at runtime.
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Run E2E tests
        working-directory: apps/web
        run: npx playwright test --shard=${{ matrix.shard }}/2
        env:
          # --- lib/env.ts runtime validation (run 30366471487 failed on the
          # --- Stripe pair; the webServer 500'd every route that imports env)
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          # ENCRYPTION_MASTER_KEY + CSRF_SECRET come from GITHUB_ENV (see
          # "Generate ephemeral CI-only secrets" step above).
          #
          # No Upstash Redis in CI. REDIS_REQUIRED=false is the documented
          # operator opt-out in lib/rate-limiter/core.ts — without it the
          # limiter throws at init under NODE_ENV=production and every
          # request is BLOCKED (fail-closed). Request-path limits are then
          # bypassed via the E2E_TESTING gate in both limiters.
          REDIS_REQUIRED: 'false'
          # E2E auth fixture: activates the gated /api/test-auth/login endpoint
          # (see app/api/test-auth/login/route.ts). Both are read at runtime by
          # the webServer AND by global-setup, which inherits this env.
          # E2E_TESTING also disables rate limiting (lib/rate-limiter.ts,
          # lib/rate-limiter/core.ts) — production per-IP limits (5 logins/15min)
          # cannot hold for a serial suite driving everything from localhost.
          E2E_TESTING: 'true'
          E2E_AUTH_SECRET: ${{ secrets.E2E_AUTH_SECRET }}
          # Cross-browser projects (firefox/webkit/mobile) only on pushes to
          # main — PRs run Chromium-only to fit the CI budget
          # (see playwright.config.ts).
          E2E_ALL_BROWSERS: ${{ github.event_name == 'push' && 'true' || 'false' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: apps/web/playwright-report/
          retention-days: 30

      - name: Upload mobile responsive screenshots
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: mobile-screenshots-shard-${{ matrix.shard }}
          path: apps/web/test-results/mobile-screenshots/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v4
        with:
          name: playwright-videos-shard-${{ matrix.shard }}
          path: apps/web/test-results/
          retention-days: 7
